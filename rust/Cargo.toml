[package]
name = "my_webgpu_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "HtmlElement",
    "MouseEvent",
    "EventTarget",
    "Gpu"
] }
wgpu = "29.0.1"
bytemuck = { version = "1", features = ["derive"] }
nalgebra = "0.33"