[package]
name = "my_webgpu_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native"
path = "src/bin/native.rs"
required-features = ["native"]

[features]
default = []
native = ["serde", "serde_json"]
# GPU compute path for ParticleClothSim. WASM-only — enabling on a non-wasm
# target raises a compile_error in src/sim/mod.rs.
gpu = []

[dependencies]
nalgebra = "0.33"
spade = "2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "HtmlElement",
    "MouseEvent",
    "KeyboardEvent",
    "EventTarget",
    "Gpu",
    "TouchEvent",
    "TouchList",
    "Touch",
    "DomRect",
    "Element",
    "Performance",
    "console"
] }
wgpu = "29.0.1"
bytemuck = { version = "1", features = ["derive"] }
